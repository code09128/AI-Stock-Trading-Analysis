  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230ea5e9'/%3E%3Cstop offset='1' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cg stroke='white' stroke-width='2' stroke-linecap='round' fill='none'%3E%3Cpath d='M12 6v4M12 22v3M21 5v3M21 18v4'/%3E%3Crect x='9.5' y='10' width='5' height='12' rx='1' fill='white'/%3E%3Crect x='18.5' y='8' width='5' height='10' rx='1'/%3E%3C/g%3E%3C/svg%3E">
  <!-- 第三方套件放在 web/vendor（固定版本：Tailwind 3.4.17、React 18.3.1、esbuild 打包），離線也能開；字型離線時改用系統字型 -->
  <script>
    // 先套主題，避免淺色主題開頁時閃一下深色（完整的外觀偏好由設定頁的外觀模組套用）
    try { const t = JSON.parse(localStorage.getItem('tw_us_ui_prefs_v1') || 'null')?.theme; if (t === 'warm' || t === 'cream' || t === 'lilac') document.documentElement.dataset.theme = t; } catch (_e) {}
  </script>
  <script src="./vendor/tailwindcss-3.4.17.js"></script>
  <script>
    // 主題色票：三套主題（A 霧面玻璃＝預設、B 暖色、C 奶油淺色）的 Tailwind 色階都走 CSS 變數（--slate-300 這類，值是「R G B」），
    // 切換時只換 <html data-theme>，元件的 class 不用改。<alpha-value> 讓 bg-slate-900/90 這類半透明寫法照常運作。
    // 淺色主題的做法：中性色整條反轉（深底淺字 → 淺底深字）；彩色只反轉「當文字的淺色（50～400）」與「當底色的深色（800～950）」，
    // 500～700 是實心按鈕底色，維持原樣，上面的白字（--ink 在這些底色上設回白色，見 <style>）才看得清楚。
    // 漲跌色 rose-400／emerald-400 另外走 --up／--down（頂欄「紅漲綠跌」切換）。
    (() => {
      const K = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
      const pal = (hex) => Object.fromEntries(K.map((k, i) => [k, hex[i]]));
      const TW = {
        amber: pal(['#fffbeb', '#fef3c7', '#fde68a', '#fcd34d', '#fbbf24', '#f59e0b', '#d97706', '#b45309', '#92400e', '#78350f', '#451a03']),
        rose: pal(['#fff1f2', '#ffe4e6', '#fecdd3', '#fda4af', '#fb7185', '#f43f5e', '#e11d48', '#be123c', '#9f1239', '#881337', '#4c0519']),
        emerald: pal(['#ecfdf5', '#d1fae5', '#a7f3d0', '#6ee7b7', '#34d399', '#10b981', '#059669', '#047857', '#065f46', '#064e3b', '#022c22']),
        cyan: pal(['#ecfeff', '#cffafe', '#a5f3fc', '#67e8f9', '#22d3ee', '#06b6d4', '#0891b2', '#0e7490', '#155e75', '#164e63', '#083344']),
        violet: pal(['#f5f3ff', '#ede9fe', '#ddd6fe', '#c4b5fd', '#a78bfa', '#8b5cf6', '#7c3aed', '#6d28d9', '#5b21b6', '#4c1d95', '#2e1065']),
        teal: pal(['#f0fdfa', '#ccfbf1', '#99f6e4', '#5eead4', '#2dd4bf', '#14b8a6', '#0d9488', '#0f766e', '#115e59', '#134e4a', '#042f2e']),
        yellow: pal(['#fefce8', '#fef9c3', '#fef08a', '#fde047', '#facc15', '#eab308', '#ca8a04', '#a16207', '#854d0e', '#713f12', '#422006']),
      };
      const SLATE = pal(['#f5f7fb', '#e8ebf4', '#dde1ec', '#c3c9d8', '#8a93a8', '#6a7388', '#454d61', '#2b3244', '#1d2333', '#111625', '#0b0f1c']);
      const ACCENT = pal(['#eef2ff', '#dfe6ff', '#c8d4ff', '#b8c8ff', '#7d9dff', '#4f7cff', '#4f7cff', '#3f63d6', '#304ca8', '#243a80', '#16244f']);
      // 淺色反轉：50↔950、100↔900、200↔800、300↔700、400↔600；500～700 實心色不動
      const flip = (p) => ({ ...p, 50: p[950], 100: p[900], 200: p[800], 300: p[700], 400: p[600], 800: p[200], 900: p[100], 950: p[50] });
      const THEMES = {
        glass: { slate: SLATE, accent: ACCENT, ...TW },
        warm: {
          ...TW,
          slate: pal(['#fbf1ea', '#f3e6dd', '#e6d3c8', '#d5bdb0', '#b9a094', '#8d776d', '#5e4c45', '#40332e', '#2e2421', '#241b18', '#1a1311']),
          // 強調色用橘色、漸層第二色用珊瑚色，和警示用的 amber 分開
          accent: pal(['#fff7f2', '#ffeadb', '#fed3b6', '#fdba8c', '#fb9a5c', '#f0803c', '#c45a1f', '#a84a18', '#8a3f17', '#6b3214', '#3b1a0a']),
          violet: pal(['#fff1ee', '#ffe0d9', '#fcc4b6', '#f6a68f', '#ef8a6d', '#e8795c', '#cf5f42', '#ad4a31', '#8a3a27', '#6e2f21', '#3f1a12']),
        },
        cream: {
          ...Object.fromEntries(Object.entries(TW).map(([k, v]) => [k, flip(v)])),
          // 中性色整條反轉：900 是卡片、950 是頁面底色，50 是最深的字
          slate: pal(['#2b2622', '#3a332e', '#4a423c', '#554c45', '#5f564f', '#766c63', '#a39a90', '#d3cbc1', '#e3ddd4', '#efeae3', '#e8e3db']),
          accent: pal(['#16244f', '#1c2d66', '#243a80', '#2c46a0', '#3652b8', '#4466d6', '#3f63d6', '#3550b8', '#c8d4ff', '#dfe6ff', '#eef2ff']),
        },
        // D 白底紫色：內容區白底、薰衣草灰字、紫色強調（做法同奶油淺色：中性色整條反轉）
        lilac: {
          ...Object.fromEntries(Object.entries(TW).map(([k, v]) => [k, flip(v)])),
          slate: pal(['#1e2140', '#272a4d', '#33365c', '#43476d', '#5a5e82', '#73789b', '#a3a7c4', '#cfd1e6', '#e4e5f2', '#ffffff', '#f3f2fb']),
          accent: pal(['#1f1147', '#2a1866', '#3a2490', '#4b30b3', '#5d3fd0', '#7c5cff', '#6d4ae8', '#5b3bd1', '#ddd3ff', '#ede8ff', '#f6f3ff']),
        },
        // D 白底紫色的側欄：深紫底、淺色字（只套在 <aside> 裡，見下方 block）
        lilacSide: {
          ...TW,
          slate: pal(['#f4f2ff', '#ece9ff', '#ddd8fa', '#c9c3ee', '#a8a2d8', '#8a84bd', '#5b5490', '#3f3872', '#2f2860', '#241e4c', '#1c1738']),
          accent: pal(['#f3f0ff', '#e6e0ff', '#d4caff', '#c4b5fd', '#a78bfa', '#8b6cff', '#7c5cff', '#6d4ae8', '#4c2fb0', '#36207f', '#1f1147']),
        },
      };
      const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(' ');
      const block = (sel, t, ink) =>
        `${sel}{--ink:${ink};${Object.entries(t).map(([name, p]) => K.map((k) => `--${name}-${k}:${rgb(p[k])};`).join('')).join('')}}`;
      const css = [
        block(':root', THEMES.glass, '255 255 255'),
        block('html[data-theme="warm"]', THEMES.warm, '255 255 255'),
        block('html[data-theme="cream"]', THEMES.cream, '43 38 34'),
        // 產業鏈地圖是深色畫布（霓虹風格），淺色主題時整塊維持霧面玻璃色票（class ta-force-dark）
        block('html[data-theme="cream"] .ta-force-dark', THEMES.glass, '255 255 255'),
        block('html[data-theme="lilac"]', THEMES.lilac, '30 33 64'),
        block('html[data-theme="lilac"] .ta-force-dark', THEMES.glass, '255 255 255'),
        block('html[data-theme="lilac"] #root aside[data-tour="sidebar"]', THEMES.lilacSide, '255 255 255'),
      ].join('\n');
      const el = document.createElement('style');
      el.id = 'theme-palette';
      el.textContent = css;
      document.head.appendChild(el);
      const v = (name) => Object.fromEntries(K.map((k) => [k, `rgb(var(--${name}-${k}) / <alpha-value>)`]));
      const accent = v('accent');
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: v('slate'),
              white: 'rgb(var(--ink) / <alpha-value>)',
              sky: accent, blue: accent, indigo: accent,
              amber: v('amber'), cyan: v('cyan'), violet: v('violet'), teal: v('teal'), yellow: v('yellow'),
              // 漲跌色走 CSS 變數，頂欄「紅漲綠跌」切換時整站一起換
              rose: { ...v('rose'), 400: 'var(--up)' },
              emerald: { ...v('emerald'), 400: 'var(--down)' },
            },
            fontFamily: {
              sans: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
              mono: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    })();
  </script>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字型不擋畫面：先用系統字型顯示，下載完再換（離線時也不會卡住啟動） -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <!-- 載入動畫：React 掛載前顯示；桌面版（desktop.py）啟動伺服器時也用同一段 -->
  <style id="splash-css">
    /* 顏色全部走 #splash 自己的變數：桌面版（desktop.py）只取這一段 CSS 來顯示，拿不到主題色票，所以預設值＝主題 A 霧面玻璃；
       網頁版開頁時 <html data-theme> 已先套上，下面依主題覆寫。 */
    #splash {
      --sp-bg: radial-gradient(900px 500px at 8% -10%, rgba(79, 124, 255, 0.16), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(139, 92, 246, 0.14), transparent 55%), #070a13;
      --sp-fg: #e8ebf4; --sp-muted: #8a93a8; --sp-dim: #6a7388;
      --sp-card: rgba(17, 22, 37, 0.76); --sp-line: rgba(255, 255, 255, 0.08);
      --sp-card-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 8px 32px rgba(0, 0, 0, 0.32);
      --sp-raise: inset 0 1px 0 rgba(255, 255, 255, 0.1), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 3px 3px 8px rgba(0, 0, 0, 0.45);
      --sp-star: #c8d4ff; --sp-grid: rgba(255, 255, 255, 0.07);
      --sp-row: rgba(255, 255, 255, 0.03); --sp-spin-track: rgba(255, 255, 255, 0.12);
      --sp-a1: #4f7cff; --sp-a2: #8b5cf6;
      --sp-up: var(--up, #ff4d6d); --sp-down: var(--down, #22d3a0);
      --sp-ok: #10b981; --sp-warn: #f59e0b; --sp-note: #fbbf24; --sp-on-icon: #0b0f1c;
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: var(--sp-bg); color: var(--sp-fg); user-select: none;
      font-family: 'Inter', 'Noto Sans TC', 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif;
    }
    html[data-theme="warm"] #splash {
      --sp-bg: radial-gradient(900px 500px at 8% -10%, rgba(245, 165, 36, 0.16), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(232, 121, 92, 0.14), transparent 55%), #1a1311;
      --sp-fg: #fbf1ea; --sp-muted: #b9a094; --sp-dim: #8d776d;
      --sp-card: rgba(36, 27, 24, 0.78); --sp-line: rgba(255, 226, 210, 0.1);
      --sp-raise: inset 0 1px 0 rgba(255, 236, 224, 0.12), inset 0 -1px 0 rgba(0, 0, 0, 0.3), 3px 3px 8px rgba(10, 4, 2, 0.5);
      --sp-a1: #f0803c; --sp-a2: #e8795c; --sp-on-icon: #1a1311; --sp-star: #ffd9bf;
    }
    html[data-theme="cream"] #splash {
      --sp-bg: #e8e3db; --sp-fg: #2b2622; --sp-muted: #766c63; --sp-dim: #a39a90;
      --sp-card: #efeae3; --sp-line: transparent;
      --sp-card-shadow: 6px 6px 16px rgba(165, 150, 132, 0.45), -6px -6px 16px rgba(255, 255, 255, 0.85);
      --sp-raise: 3px 3px 7px rgba(165, 150, 132, 0.42), -3px -3px 7px rgba(255, 255, 255, 0.9);
      --sp-star: #4466d6; --sp-grid: rgba(60, 48, 40, 0.1);
      --sp-row: rgba(60, 48, 40, 0.035); --sp-spin-track: rgba(60, 48, 40, 0.15);
      --sp-a1: #3f63d6; --sp-a2: #7c3aed; --sp-ok: #0b7550; --sp-warn: #b45309; --sp-note: #92400e; --sp-on-icon: #fff;
    }
    html[data-theme="lilac"] #splash {
      --sp-bg: radial-gradient(800px 500px at 50% -10%, rgba(124, 92, 255, 0.35), transparent 60%), linear-gradient(170deg, #2a2153, #1c1738);
      --sp-fg: #1e2140; --sp-muted: #73789b; --sp-dim: #a3a7c4;
      --sp-card: #fff; --sp-line: rgba(40, 40, 90, 0.08);
      --sp-card-shadow: 0 24px 60px -20px rgba(10, 6, 40, 0.6);
      --sp-raise: 0 1px 2px rgba(60, 50, 140, 0.14), 0 4px 12px -6px rgba(60, 50, 140, 0.28);
      --sp-star: #e6e0ff; --sp-grid: rgba(60, 50, 140, 0.1);
      --sp-row: rgba(124, 92, 255, 0.05); --sp-spin-track: rgba(60, 50, 140, 0.15);
      --sp-a1: #7c5cff; --sp-a2: #5b3bd1; --sp-ok: #0a8a5f; --sp-warn: #b45309; --sp-note: #92400e; --sp-on-icon: #fff;
    }
    /* 背景星空：星點從畫面中央往外拉成光線（曲速穿梭），由下方 <script> 畫在 canvas 上 */
    #splash .sp-stars { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--sp-star); pointer-events: none; }
    html[data-theme="cream"] #splash .sp-stars { opacity: 0.5; }
    #splash .sp-card { position: relative; z-index: 1; width: 380px; max-width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 28px 24px 22px; border-radius: 20px; background-color: var(--sp-card);
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 55%);
      border: 1px solid var(--sp-line); box-shadow: var(--sp-card-shadow); animation: sp-in 0.4s cubic-bezier(.2, .8, .2, 1) backwards; }
    #splash .sp-logo { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative;
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 55%), linear-gradient(135deg, var(--sp-a1), var(--sp-a2));
      box-shadow: var(--sp-raise), 0 10px 26px -10px var(--sp-a1); }
    /* 卡片四角的 HUD 框線 */
    #splash .sp-hud { position: absolute; inset: 10px; pointer-events: none; opacity: 0.7; --c: var(--sp-a1); --l: 14px;
      background:
        linear-gradient(var(--c), var(--c)) top left / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) top left / 1px var(--l) no-repeat,
        linear-gradient(var(--c), var(--c)) top right / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) top right / 1px var(--l) no-repeat,
        linear-gradient(var(--c), var(--c)) bottom left / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom left / 1px var(--l) no-repeat,
        linear-gradient(var(--c), var(--c)) bottom right / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom right / 1px var(--l) no-repeat; }
    /* Logo 外圍的軌道：虛線圓環慢慢轉，上面有一顆衛星 */
    #splash .sp-orbit { position: absolute; inset: -12px; border-radius: 50%; border: 1px dashed var(--sp-a1); opacity: 0.55;
      animation: sp-spin 9s linear infinite; }
    #splash .sp-orbit::before { content: ""; position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%;
      background: var(--sp-a1); box-shadow: 0 0 8px 2px var(--sp-a1); }
    #splash .sp-title { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; margin-top: 2px; }
    #splash .sp-sub { font-size: 11px; color: var(--sp-dim); letter-spacing: 0.18em; text-transform: uppercase; margin-top: -10px; }
    #splash .sp-ver { font-size: 12px; color: var(--sp-muted); margin-top: -8px; min-height: 16px; }
    #splash .sp-note { width: 100%; box-sizing: border-box; font-size: 11px; color: var(--sp-note); line-height: 1.6;
      border-left: 2px solid var(--sp-warn); padding: 4px 0 4px 8px; white-space: pre-line; }
    /* 小 K 線：平面格線上輪流長高的蠟燭（實體＋影線），紅綠跟著頂欄「紅漲綠跌」設定；一道掃描光左右來回 */
    #splash .sp-chart { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; box-sizing: border-box; height: 72px; border-radius: 12px;
      background: repeating-linear-gradient(0deg, transparent 0 17px, var(--sp-grid) 17px 18px); }
    #splash .sp-chart::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 48px;
      background: linear-gradient(90deg, transparent, var(--sp-a1), transparent); opacity: 0.18; animation: sp-scan 2.6s ease-in-out infinite alternate; }
    #splash .sp-bar { width: 8px; height: 16px; border-radius: 2px; position: relative; animation: sp-grow 1.4s ease-in-out infinite; }
    #splash .sp-bar::before { content: ""; position: absolute; left: 3.5px; width: 1px; top: -7px; bottom: -7px; background: inherit; opacity: 0.8; }
    #splash .sp-up { background: var(--sp-up); }
    #splash .sp-dn { background: var(--sp-down); }
    #splash .sp-bar:nth-child(2) { animation-delay: 0.12s; }
    #splash .sp-bar:nth-child(3) { animation-delay: 0.24s; }
    #splash .sp-bar:nth-child(4) { animation-delay: 0.36s; }
    #splash .sp-bar:nth-child(5) { animation-delay: 0.48s; }
    #splash .sp-bar:nth-child(6) { animation-delay: 0.6s; }
    #splash .sp-bar:nth-child(7) { animation-delay: 0.72s; }
    #splash .sp-bar:nth-child(8) { animation-delay: 0.84s; }
    #splash .sp-bar:nth-child(9) { animation-delay: 0.96s; }
    #splash .sp-track { width: 100%; height: 4px; border-radius: 4px; background: var(--sp-grid); overflow: hidden; }
    #splash .sp-fill { width: 38%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--sp-a1), var(--sp-a2));
      box-shadow: 0 0 10px var(--sp-a1); animation: sp-slide 1.2s ease-in-out infinite; }
    #splash .sp-msg { font-size: 13px; color: var(--sp-muted); min-height: 18px; margin-top: -4px; }
    #splash .sp-steps { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
    #splash .sp-steps:empty { display: none; }
    #splash .sp-steps li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--sp-row);
      color: var(--sp-muted); animation: sp-in 0.25s ease-out backwards; }
    #splash .sp-steps li[data-state="ok"] { color: var(--sp-fg); }
    #splash .sp-icon { width: 14px; height: 14px; flex: none; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 10px; font-weight: 700; box-sizing: border-box; }
    #splash li[data-state="run"] .sp-icon { border: 2px solid var(--sp-spin-track); border-top-color: var(--sp-a1); animation: sp-spin 0.8s linear infinite; }
    #splash li[data-state="ok"] .sp-icon { background: var(--sp-ok); color: var(--sp-on-icon); }
    #splash li[data-state="warn"] .sp-icon { background: var(--sp-warn); color: var(--sp-on-icon); }
    #splash .sp-label { flex: none; }
    #splash .sp-detail { margin-left: auto; color: var(--sp-dim); font-size: 11px; text-align: right; overflow: hidden;

    <script>
      // 曲速星空：星點從畫面中央往外拉成光線。canvas 被 React 換掉（isConnected 變 false）就停；
      // 「減少動態效果」時只畫一次靜止星點。限制：雲端版之後若開嚴格 CSP，這段內嵌腳本要改成外部檔或加 hash。
      (() => {
        const cv = document.querySelector('#splash .sp-stars');
        const ctx = cv && cv.getContext && cv.getContext('2d');
        if (!ctx) return;
        const still = matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'reduce';
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let W = 0, H = 0;
        const stars = [];
        const spawn = (s, far) => {
          s.x = (Math.random() * 2 - 1) * W; s.y = (Math.random() * 2 - 1) * H;
          s.z = far ? W : Math.random() * W; s.pz = s.z;
          return s;
        };
        const size = () => {
          W = cv.clientWidth || 1; H = cv.clientHeight || 1;
          cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        size();
        for (let i = 0; i < 170; i++) stars.push(spawn({}, false));
        const proj = (v, z, c) => c + (v / z) * W * 0.22;
        let last = performance.now();
        const draw = (now) => {
          if (!cv.isConnected) return;
          const dt = Math.min(now - last, 50); last = now;
          const cx = W / 2, cy = H / 2;
          ctx.clearRect(0, 0, W, H);
          ctx.strokeStyle = ctx.fillStyle = getComputedStyle(cv).color;
          ctx.lineCap = 'round';
          for (const s of stars) {
            s.pz = s.z;
            if (!still) s.z -= W * 0.00032 * dt;
            if (s.z < 1) { spawn(s, true); continue; }
            const x = proj(s.x, s.z, cx), y = proj(s.y, s.z, cy);
            if (x < -20 || x > W + 20 || y < -20 || y > H + 20) { spawn(s, true); continue; }
            const t = 1 - s.z / W;
            ctx.globalAlpha = Math.min(1, t * 1.4);
            if (still) { ctx.beginPath(); ctx.arc(x, y, 0.4 + t * 1.4, 0, 7); ctx.fill(); continue; }
            ctx.lineWidth = 0.4 + t * 1.8;
            ctx.beginPath(); ctx.moveTo(proj(s.x, s.pz, cx), proj(s.y, s.pz, cy)); ctx.lineTo(x, y); ctx.stroke();
          }
          if (!still) requestAnimationFrame(draw);
        };
        addEventListener('resize', () => { if (cv.isConnected) { size(); if (still) draw(performance.now()); } });
        requestAnimationFrame(draw);
      })();
    </script>
  </div><!--/splash--></div>

  <script src="./app.bundle.js"></script>
