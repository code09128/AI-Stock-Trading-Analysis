  <!-- 第三方套件放在 web/vendor（固定版本：Tailwind 3.4.17、React 18.3.1、Babel 7.26.4），離線也能開；字型離線時改用系統字型 -->
  <script src="./vendor/tailwindcss-3.4.17.js"></script>
  <script>
    // 主題：中性深灰底、單一藍色強調色；漲跌維持台股紅漲綠跌（rose / emerald），amber 只用於警示
    const ACCENT = { 50: '#e8f1fd', 100: '#cde2fb', 200: '#9ec5f4', 300: '#86b6ef', 400: '#5598e7', 500: '#3987e5',
      600: '#2a78d6', 700: '#256abf', 800: '#1c5cab', 900: '#184f95', 950: '#0d366b' };
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: { 50: '#f5f7fa', 100: '#eef1f5', 200: '#dde2e9', 300: '#c3cad4', 400: '#9aa4b2', 500: '#6b7584',
              600: '#4a5361', 700: '#2f3744', 800: '#222934', 900: '#161b22', 950: '#0d1117' },
            sky: ACCENT, blue: ACCENT, indigo: ACCENT, cyan: ACCENT, violet: ACCENT, purple: ACCENT,
          },
          fontFamily: {
            sans: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
            mono: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #0d1117;
      color: #dde2e9;
      -webkit-font-smoothing: antialiased;
    }

    /* 數字用等寬數字（tabular），不用程式字型：表格對齊又不像工程畫面 */
    .mono,
    .font-mono {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    /* 最小字級拉高一點；圓角收斂成專業看盤軟體常見的 8～12px；去掉彩色光暈 */
    .text-\[10px\] { font-size: 11px !important; }
    .text-\[11px\] { font-size: 12px !important; }
    .rounded-2xl { border-radius: 12px !important; }
    .rounded-xl { border-radius: 10px !important; }
    [class*="shadow-sky-"], [class*="shadow-blue-"], [class*="shadow-emerald-"], [class*="shadow-rose-"] {
      --tw-shadow-color: transparent !important;
      box-shadow: none !important;
    }
    h1, h2 { letter-spacing: -0.01em; }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(51, 65, 85, 0.7);
      backdrop-filter: blur(8px);
    }

    .active-tab {
      background: #2a78d6;
      color: #ffffff;
      border-color: #3987e5;
    }

    .module-active {
      background: rgba(37, 99, 235, 0.16);
      border-color: #3b82f6;
      color: #ffffff;
    }
  </style>
</head>
