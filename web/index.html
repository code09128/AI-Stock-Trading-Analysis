  <!-- 第三方套件放在 web/vendor（固定版本：Tailwind 3.4.17、React 18.3.1、Babel 7.26.4），離線也能開；字型離線時改用系統字型 -->

    const ACCENT = { 50: '#e8f1fd', 100: '#cde2fb', 200: '#9ec5f4', 300: '#86b6ef', 400: '#5598e7', 500: '#3987e5',
      600: '#2a78d6', 700: '#256abf', 800: '#1c5cab', 900: '#184f95', 950: '#0d366b' };
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: { 50: '#f5f7fa', 100: '#eef1f5', 200: '#dde2e9', 300: '#c3cad4', 400: '#9aa4b2', 500: '#6b7584',
              600: '#4a5361', 700: '#2f3744', 800: '#222934', 900: '#161b22', 950: '#0d1117' },
            sky: ACCENT, blue: ACCENT, indigo: ACCENT,
          },
          fontFamily: {
            sans: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
            mono: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- 載入動畫：React 掛載前顯示；桌面版（desktop.py）啟動伺服器時也用同一段 -->
  <style id="splash-css">
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #0d1117; color: #dde2e9;
      font-family: 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif; user-select: none; }
    #splash .sp-logo { width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #0ea5e9, #4f46e5); display: flex; align-items: center; justify-content: center; }
    #splash .sp-title { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
    #splash .sp-sub { font-size: 12px; color: #6b7584; letter-spacing: 0.18em; text-transform: uppercase; margin-top: -12px; }
    #splash .sp-ver { font-size: 12px; color: #9aa4b2; margin-top: -10px; min-height: 16px; }
    #splash .sp-note { width: 340px; max-width: calc(100vw - 32px); font-size: 11px; color: #fbbf24; line-height: 1.6;
      border-left: 2px solid #f59e0b; padding-left: 8px; white-space: pre-line; }
    #splash .sp-chart { display: flex; align-items: flex-end; gap: 7px; height: 56px; margin-top: 6px; }
    #splash .sp-bar { width: 9px; border-radius: 2px; position: relative; animation: sp-grow 1.2s ease-in-out infinite; }
    #splash .sp-bar::before { content: ''; position: absolute; left: 4px; width: 1px; top: -8px; bottom: -8px; background: inherit; }
    #splash .sp-up { background: #f43f5e; }
    #splash .sp-dn { background: #10b981; }
    #splash .sp-bar:nth-child(1) { animation-delay: 0s; }
    #splash .sp-bar:nth-child(2) { animation-delay: 0.12s; }
    #splash .sp-bar:nth-child(3) { animation-delay: 0.24s; }
    #splash .sp-bar:nth-child(4) { animation-delay: 0.36s; }
    #splash .sp-bar:nth-child(5) { animation-delay: 0.48s; }
    #splash .sp-bar:nth-child(6) { animation-delay: 0.6s; }
    #splash .sp-bar:nth-child(7) { animation-delay: 0.72s; }
    @keyframes sp-grow { 0%, 100% { height: 14px; opacity: 0.55; } 50% { height: 44px; opacity: 1; } }
    #splash .sp-track { width: 220px; height: 3px; border-radius: 2px; background: #222934; overflow: hidden; }
    #splash .sp-fill { width: 40%; height: 100%; border-radius: 2px; background: #3987e5; animation: sp-slide 1.1s ease-in-out infinite; }
    @keyframes sp-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #splash .sp-msg { font-size: 13px; color: #9aa4b2; min-height: 18px; }
    #splash .sp-steps { list-style: none; margin: 0; padding: 0; width: 340px; max-width: calc(100vw - 32px);
      display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    #splash .sp-steps:empty { display: none; }
    #splash .sp-steps li { display: flex; align-items: center; gap: 8px; color: #9aa4b2; animation: sp-in 0.25s ease-out; }
    #splash .sp-steps li[data-state="ok"] { color: #dde2e9; }
    #splash .sp-icon { width: 14px; height: 14px; flex: none; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 10px; font-weight: 700; }
    #splash li[data-state="run"] .sp-icon { border: 2px solid #334155; border-top-color: #3987e5; animation: sp-spin 0.8s linear infinite; }
    #splash li[data-state="ok"] .sp-icon { background: #10b981; color: #0d1117; }
    #splash li[data-state="warn"] .sp-icon { background: #f59e0b; color: #0d1117; }
    #splash .sp-label { flex: none; }
    #splash .sp-detail { margin-left: auto; color: #6b7584; font-size: 11px; text-align: right; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #splash .sp-skip { visibility: hidden; background: none; border: 1px solid #334155; color: #9aa4b2; border-radius: 8px;
      padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
    #splash .sp-skip.show { visibility: visible; }
    #splash .sp-skip:hover { color: #fff; border-color: #3987e5; }
    @keyframes sp-spin { to { transform: rotate(360deg); } }
    @keyframes sp-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #splash .sp-bar, #splash .sp-fill, #splash .sp-steps li, #splash li .sp-icon { animation: none; } }
  </style>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #0d1117;
      color: #dde2e9;
      -webkit-font-smoothing: antialiased;
    }

    /* 數字用等寬數字（tabular），不用程式字型：表格對齊又不像工程畫面 */
    .mono,
    .font-mono {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    /* 最小字級拉高一點；圓角收斂成專業看盤軟體常見的 8～12px；去掉彩色光暈 */
    .text-\[10px\] { font-size: 11px !important; }
    .text-\[11px\] { font-size: 12px !important; }
    .rounded-2xl { border-radius: 12px !important; }
    .rounded-xl { border-radius: 10px !important; }
    [class*="shadow-sky-"], [class*="shadow-blue-"], [class*="shadow-emerald-"], [class*="shadow-rose-"] {
      --tw-shadow-color: transparent !important;
      box-shadow: none !important;
    }
    h1, h2 { letter-spacing: -0.01em; }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(51, 65, 85, 0.7);
      backdrop-filter: blur(8px);
    }

    .active-tab {
      background: #2a78d6;
      color: #ffffff;
      border-color: #3987e5;
    }

    .module-active {
      background: rgba(37, 99, 235, 0.16);
      border-color: #3b82f6;
      color: #ffffff;
    }
  </style>
