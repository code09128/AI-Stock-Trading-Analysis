  <!-- 第三方套件放在 web/vendor（固定版本：Tailwind 3.4.17、React 18.3.1、esbuild 打包），離線也能開；字型離線時改用系統字型 -->
  <script>
    // 先套主題，避免淺色主題開頁時閃一下深色（完整的外觀偏好由設定頁的外觀模組套用）
    try { const t = JSON.parse(localStorage.getItem('tw_us_ui_prefs_v1') || 'null')?.theme; if (t === 'warm' || t === 'cream') document.documentElement.dataset.theme = t; } catch (_e) {}

  <script src="./vendor/tailwindcss-3.4.17.js"></script>
  <script>
    // 主題色票：三套主題（A 霧面玻璃＝預設、B 暖色、C 奶油淺色）的 Tailwind 色階都走 CSS 變數（--slate-300 這類，值是「R G B」），
    // 切換時只換 <html data-theme>，元件的 class 不用改。<alpha-value> 讓 bg-slate-900/90 這類半透明寫法照常運作。
    // 淺色主題的做法：中性色整條反轉（深底淺字 → 淺底深字）；彩色只反轉「當文字的淺色（50～400）」與「當底色的深色（800～950）」，
    // 500～700 是實心按鈕底色，維持原樣，上面的白字（--ink 在這些底色上設回白色，見 <style>）才看得清楚。
    // 漲跌色 rose-400／emerald-400 另外走 --up／--down（頂欄「紅漲綠跌」切換）。
    (() => {
      const K = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
      const pal = (hex) => Object.fromEntries(K.map((k, i) => [k, hex[i]]));
      const TW = {
        amber: pal(['#fffbeb', '#fef3c7', '#fde68a', '#fcd34d', '#fbbf24', '#f59e0b', '#d97706', '#b45309', '#92400e', '#78350f', '#451a03']),
        rose: pal(['#fff1f2', '#ffe4e6', '#fecdd3', '#fda4af', '#fb7185', '#f43f5e', '#e11d48', '#be123c', '#9f1239', '#881337', '#4c0519']),
        emerald: pal(['#ecfdf5', '#d1fae5', '#a7f3d0', '#6ee7b7', '#34d399', '#10b981', '#059669', '#047857', '#065f46', '#064e3b', '#022c22']),
        cyan: pal(['#ecfeff', '#cffafe', '#a5f3fc', '#67e8f9', '#22d3ee', '#06b6d4', '#0891b2', '#0e7490', '#155e75', '#164e63', '#083344']),
        violet: pal(['#f5f3ff', '#ede9fe', '#ddd6fe', '#c4b5fd', '#a78bfa', '#8b5cf6', '#7c3aed', '#6d28d9', '#5b21b6', '#4c1d95', '#2e1065']),
        teal: pal(['#f0fdfa', '#ccfbf1', '#99f6e4', '#5eead4', '#2dd4bf', '#14b8a6', '#0d9488', '#0f766e', '#115e59', '#134e4a', '#042f2e']),
        yellow: pal(['#fefce8', '#fef9c3', '#fef08a', '#fde047', '#facc15', '#eab308', '#ca8a04', '#a16207', '#854d0e', '#713f12', '#422006']),
      };
      const SLATE = pal(['#f5f7fb', '#e8ebf4', '#dde1ec', '#c3c9d8', '#8a93a8', '#6a7388', '#454d61', '#2b3244', '#1d2333', '#111625', '#0b0f1c']);
      const ACCENT = pal(['#eef2ff', '#dfe6ff', '#c8d4ff', '#b8c8ff', '#7d9dff', '#4f7cff', '#4f7cff', '#3f63d6', '#304ca8', '#243a80', '#16244f']);
      // 淺色反轉：50↔950、100↔900、200↔800、300↔700、400↔600；500～700 實心色不動
      const flip = (p) => ({ ...p, 50: p[950], 100: p[900], 200: p[800], 300: p[700], 400: p[600], 800: p[200], 900: p[100], 950: p[50] });
      const THEMES = {
        glass: { slate: SLATE, accent: ACCENT, ...TW },
        warm: {
          ...TW,
          slate: pal(['#fbf1ea', '#f3e6dd', '#e6d3c8', '#d5bdb0', '#b9a094', '#8d776d', '#5e4c45', '#40332e', '#2e2421', '#241b18', '#1a1311']),
          // 強調色用橘色、漸層第二色用珊瑚色，和警示用的 amber 分開
          accent: pal(['#fff7f2', '#ffeadb', '#fed3b6', '#fdba8c', '#fb9a5c', '#f0803c', '#c45a1f', '#a84a18', '#8a3f17', '#6b3214', '#3b1a0a']),
          violet: pal(['#fff1ee', '#ffe0d9', '#fcc4b6', '#f6a68f', '#ef8a6d', '#e8795c', '#cf5f42', '#ad4a31', '#8a3a27', '#6e2f21', '#3f1a12']),
        },
        cream: {
          ...Object.fromEntries(Object.entries(TW).map(([k, v]) => [k, flip(v)])),
          // 中性色整條反轉：900 是卡片、950 是頁面底色，50 是最深的字
          slate: pal(['#2b2622', '#3a332e', '#4a423c', '#554c45', '#5f564f', '#766c63', '#a39a90', '#d3cbc1', '#e3ddd4', '#efeae3', '#e8e3db']),
          accent: pal(['#16244f', '#1c2d66', '#243a80', '#2c46a0', '#3652b8', '#4466d6', '#3f63d6', '#3550b8', '#c8d4ff', '#dfe6ff', '#eef2ff']),
        },
      };
      const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(' ');
      const block = (sel, t, ink) =>
        `${sel}{--ink:${ink};${Object.entries(t).map(([name, p]) => K.map((k) => `--${name}-${k}:${rgb(p[k])};`).join('')).join('')}}`;
      const css = [
        block(':root', THEMES.glass, '255 255 255'),
        block('html[data-theme="warm"]', THEMES.warm, '255 255 255'),
        block('html[data-theme="cream"]', THEMES.cream, '43 38 34'),
        // 產業鏈地圖是深色畫布（霓虹風格），淺色主題時整塊維持霧面玻璃色票（class ta-force-dark）
        block('html[data-theme="cream"] .ta-force-dark', THEMES.glass, '255 255 255'),
      ].join('\n');
      const el = document.createElement('style');
      el.id = 'theme-palette';
      el.textContent = css;
      document.head.appendChild(el);
      const v = (name) => Object.fromEntries(K.map((k) => [k, `rgb(var(--${name}-${k}) / <alpha-value>)`]));
      const accent = v('accent');
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: v('slate'),
              white: 'rgb(var(--ink) / <alpha-value>)',
              sky: accent, blue: accent, indigo: accent,
              amber: v('amber'), cyan: v('cyan'), violet: v('violet'), teal: v('teal'), yellow: v('yellow'),
              // 漲跌色走 CSS 變數，頂欄「紅漲綠跌」切換時整站一起換
              rose: { ...v('rose'), 400: 'var(--up)' },
              emerald: { ...v('emerald'), 400: 'var(--down)' },
            },
            fontFamily: {
              sans: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
              mono: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    })();
  </script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #0d1117;
      color: #dde2e9;
      -webkit-font-smoothing: antialiased;
    }

    /* 數字用等寬數字（tabular），不用程式字型：表格對齊又不像工程畫面 */
    .mono,
    .font-mono {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    /* 最小字級拉高一點；圓角收斂成專業看盤軟體常見的 8～12px；去掉彩色光暈 */
    .text-\[10px\] { font-size: 11px !important; }
    .text-\[11px\] { font-size: 12px !important; }
    .rounded-2xl { border-radius: 16px !important; }
    .rounded-xl { border-radius: 12px !important; }
    [class*="shadow-sky-"], [class*="shadow-blue-"], [class*="shadow-emerald-"], [class*="shadow-rose-"] {
      --tw-shadow-color: transparent !important;
      box-shadow: none !important;
    }
    h1, h2 { letter-spacing: -0.01em; }

    /* 共用的進場動畫（新聞研究摘要等）：交錯淡入；使用者設定「減少動態效果」時全部停用 */
    @keyframes ta-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes ta-grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    /* 用 backwards：動畫結束後不留獨立圖層，否則裡面的彈出視窗、全螢幕圖表會被困住、蓋不過頂欄 */
    .ta-fade-up { animation: ta-fade-up .4s cubic-bezier(.2, .8, .2, 1) backwards; }
    .ta-grow-x { transform-origin: left center; animation: ta-grow-x .7s cubic-bezier(.2, .8, .2, 1) both; }
    .ta-tab-ind { transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
    @media (prefers-reduced-motion: reduce) { .ta-fade-up, .ta-grow-x { animation: none; } .ta-tab-ind { transition: none; } }

    /* ===== 卡片式質感（只改外觀，不動版面與功能）=====
       只改 box-shadow、背景、hover，不改 border-color 的語意色（琥珀警示、選取藍框等照舊）。
       全部動態在「減少動態效果」下停用（檔尾 media）。 */
    body {
      background:
        radial-gradient(900px 520px at 88% -8%, rgba(56, 189, 248, 0.10), transparent 62%),
        radial-gradient(800px 520px at -8% 6%, rgba(99, 102, 241, 0.10), transparent 60%),
        #0d1117;
      background-attachment: fixed;
    }
    #root > .bg-slate-950 { background: transparent; }
    /* 側欄與頂欄：半透明毛玻璃，露出背景的柔和漸層 */
    #root aside, #root header.shrink-0 {
      background-color: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
    }
    /* 大卡片：細微漸層、頂部高光、柔和陰影；滑過時邊框微亮 */
    .rounded-2xl[class*="bg-slate-900"], .rounded-xl[class*="bg-slate-900"] {
      background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0) 45%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px -12px rgba(0, 0, 0, 0.55);
      transition: border-color .2s ease, box-shadow .2s ease;

    .rounded-2xl[class*="bg-slate-900"][class*="border-slate-"]:hover,

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 12px 28px -12px rgba(14, 165, 233, 0.25);
    }
    /* 內層小卡：淡淡的內框，層次比純色塊清楚 */
    .rounded-xl[class*="bg-slate-950"], .rounded-lg[class*="bg-slate-950"] {
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.05);

    /* 可點擊的卡片與清單列：滑過微浮起，按下回彈 */
    button.rounded-lg[class*="border-slate-"], button.rounded-xl[class*="border-slate-"],

    button:active:not(:disabled) { transform: scale(0.975); }

    button.bg-sky-600, button.bg-blue-600, button.bg-violet-600 {

    /* 輸入框：聚焦時的柔光環，不靠生硬外框 */
    input:focus-visible, select:focus-visible, textarea:focus-visible {

    .ta-page { animation: ta-fade-up .35s cubic-bezier(.2, .8, .2, 1) backwards; }
    /* 報價跳動：數字短暫上浮／下沉並發光（紅漲綠跌，台股慣例） */
    @keyframes ta-tick-up { 0% { transform: translateY(4px); opacity: .55; text-shadow: 0 0 10px rgba(244, 63, 94, .9); } 100% { transform: none; opacity: 1; text-shadow: none; } }
    @keyframes ta-tick-down { 0% { transform: translateY(-4px); opacity: .55; text-shadow: 0 0 10px rgba(16, 185, 129, .9); } 100% { transform: none; opacity: 1; text-shadow: none; } }

    /* AI 分析步驟條：目前步驟的光環脈動 */

    /* 彈窗、導覽框：半透明毛玻璃（底下已有暗色遮罩，文字仍清楚） */
    .fixed .rounded-2xl[class*="bg-slate-900"] {
      background-color: rgba(15, 23, 42, 0.82);
      background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 45%);
