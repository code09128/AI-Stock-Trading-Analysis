  <!-- 第三方套件放在 web/vendor（固定版本：Tailwind 3.4.17、React 18.3.1、esbuild 打包），離線也能開；字型離線時改用系統字型 -->
  <script src="./vendor/tailwindcss-3.4.17.js"></script>
  <script>
    // 主題：中性深灰底、單一藍色強調色；漲跌維持台股紅漲綠跌（rose / emerald），amber 只用於警示
    const ACCENT = { 50: '#eef2ff', 100: '#dfe6ff', 200: '#c8d4ff', 300: '#b8c8ff', 400: '#7d9dff', 500: '#4f7cff',

            sky: ACCENT, blue: ACCENT, indigo: ACCENT,
            // 漲跌色走 CSS 變數，頂欄「紅漲綠跌」切換時整站一起換
            rose: { 400: 'var(--up)' }, emerald: { 400: 'var(--down)' },
          },
          fontFamily: {
            sans: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
            mono: ['Inter', '"Noto Sans TC"', 'system-ui', 'sans-serif'],

        },

  </script>

  <!-- 載入動畫：React 掛載前顯示；桌面版（desktop.py）啟動伺服器時也用同一段 -->
  <style id="splash-css">
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;

    #splash .sp-logo { width: 64px; height: 64px; border-radius: 16px;

    #splash .sp-title { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }

    #splash .sp-ver { font-size: 12px; color: #9aa4b2; margin-top: -10px; min-height: 16px; }
    #splash .sp-note { width: 340px; max-width: calc(100vw - 32px); font-size: 11px; color: #fbbf24; line-height: 1.6;

    #splash .sp-chart { display: flex; align-items: flex-end; gap: 7px; height: 56px; margin-top: 6px; }

    @keyframes sp-grow { 0%, 100% { height: 14px; opacity: 0.55; } 50% { height: 44px; opacity: 1; } }
    #splash .sp-track { width: 220px; height: 3px; border-radius: 2px; background: #222934; overflow: hidden; }
    #splash .sp-fill { width: 40%; height: 100%; border-radius: 2px; background: #3987e5; animation: sp-slide 1.1s ease-in-out infinite; }

    #splash .sp-msg { font-size: 13px; color: #9aa4b2; min-height: 18px; }

    #splash .sp-steps li[data-state="ok"] { color: #dde2e9; }

      border-radius: 50%; font-size: 10px; font-weight: 700; }
    #splash li[data-state="run"] .sp-icon { border: 2px solid #334155; border-top-color: #3987e5; animation: sp-spin 0.8s linear infinite; }
    #splash li[data-state="ok"] .sp-icon { background: #10b981; color: #0d1117; }

    #splash .sp-skip { visibility: hidden; background: none; border: 1px solid #334155; color: #9aa4b2; border-radius: 8px;

    #splash .sp-skip.show { visibility: visible; }

    @keyframes sp-spin { to { transform: rotate(360deg); } }

  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #0d1117;
      color: #dde2e9;
      -webkit-font-smoothing: antialiased;
    }

    /* 數字用等寬數字（tabular），不用程式字型：表格對齊又不像工程畫面 */
    .mono,
    .font-mono {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    /* 最小字級拉高一點；圓角收斂成專業看盤軟體常見的 8～12px；去掉彩色光暈 */
    .text-\[10px\] { font-size: 11px !important; }
    .text-\[11px\] { font-size: 12px !important; }
    .rounded-2xl { border-radius: 16px !important; }
    .rounded-xl { border-radius: 12px !important; }
    [class*="shadow-sky-"], [class*="shadow-blue-"], [class*="shadow-emerald-"], [class*="shadow-rose-"] {
      --tw-shadow-color: transparent !important;
      box-shadow: none !important;
    }
    h1, h2 { letter-spacing: -0.01em; }

    /* 共用的進場動畫（新聞研究摘要等）：交錯淡入；使用者設定「減少動態效果」時全部停用 */
    @keyframes ta-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes ta-grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    /* 用 backwards：動畫結束後不留獨立圖層，否則裡面的彈出視窗、全螢幕圖表會被困住、蓋不過頂欄 */
    .ta-fade-up { animation: ta-fade-up .4s cubic-bezier(.2, .8, .2, 1) backwards; }
    .ta-grow-x { transform-origin: left center; animation: ta-grow-x .7s cubic-bezier(.2, .8, .2, 1) both; }
    .ta-tab-ind { transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
    @media (prefers-reduced-motion: reduce) { .ta-fade-up, .ta-grow-x { animation: none; } .ta-tab-ind { transition: none; } }

    /* ===== 卡片式質感（只改外觀，不動版面與功能）=====
       只改 box-shadow、背景、hover，不改 border-color 的語意色（琥珀警示、選取藍框等照舊）。
       全部動態在「減少動態效果」下停用（檔尾 media）。 */
    body {
      background:
        radial-gradient(900px 520px at 88% -8%, rgba(56, 189, 248, 0.10), transparent 62%),
        radial-gradient(800px 520px at -8% 6%, rgba(99, 102, 241, 0.10), transparent 60%),
        #0d1117;
      background-attachment: fixed;
    }
    #root > .bg-slate-950 { background: transparent; }
    /* 側欄與頂欄：半透明毛玻璃，露出背景的柔和漸層 */
    #root aside, #root header.shrink-0 {
      background-color: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
    }
    /* 大卡片：細微漸層、頂部高光、柔和陰影；滑過時邊框微亮 */
    .rounded-2xl[class*="bg-slate-900"], .rounded-xl[class*="bg-slate-900"] {
      background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0) 45%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px -12px rgba(0, 0, 0, 0.55);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .rounded-2xl[class*="bg-slate-900"][class*="border-slate-"]:hover,
    .rounded-xl[class*="bg-slate-900"][class*="border-slate-"]:hover {
      border-color: rgba(56, 189, 248, 0.32);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 12px 28px -12px rgba(14, 165, 233, 0.25);
    }
    /* 內層小卡：淡淡的內框，層次比純色塊清楚 */
    .rounded-xl[class*="bg-slate-950"], .rounded-lg[class*="bg-slate-950"] {
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.05);
    }
    /* 可點擊的卡片與清單列：滑過微浮起，按下回彈 */
    button.rounded-lg[class*="border-slate-"], button.rounded-xl[class*="border-slate-"],
    .cursor-pointer.rounded-xl, .cursor-pointer.rounded-lg[class*="border"] {
      transition: transform .16s cubic-bezier(.2, .8, .2, 1), box-shadow .16s ease, border-color .16s ease, background-color .16s ease;
    }
    button.rounded-lg[class*="border-slate-"]:hover, button.rounded-xl[class*="border-slate-"]:hover,
    .cursor-pointer.rounded-xl:hover, .cursor-pointer.rounded-lg[class*="border"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px -10px rgba(0, 0, 0, 0.6);
    }
    button:active:not(:disabled) { transform: scale(0.975); }
    /* 主要按鈕：藍到靛的柔和漸層與光暈 */
    button.bg-sky-600, button.bg-blue-600, button.bg-violet-600 {
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 55%),
        linear-gradient(135deg, #0ea5e9, #4f6df0);
      box-shadow: 0 6px 16px -8px rgba(56, 189, 248, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transition: transform .16s cubic-bezier(.2, .8, .2, 1), filter .16s ease, box-shadow .16s ease;
    }
    button.bg-sky-600:hover:not(:disabled), button.bg-blue-600:hover:not(:disabled), button.bg-violet-600:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    button.bg-violet-600 { background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 55%), linear-gradient(135deg, #8b5cf6, #6366f1); box-shadow: 0 6px 16px -8px rgba(139, 92, 246, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18); }
    /* 輸入框：聚焦時的柔光環，不靠生硬外框 */
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }
    /* 切換頁面時整個內容區淡入上浮（由主內容區的 key 觸發） */
    .ta-page { animation: ta-fade-up .35s cubic-bezier(.2, .8, .2, 1) backwards; }
    /* 報價跳動：數字短暫上浮／下沉並發光（紅漲綠跌，台股慣例） */
    @keyframes ta-tick-up { 0% { transform: translateY(4px); opacity: .55; text-shadow: 0 0 10px rgba(244, 63, 94, .9); } 100% { transform: none; opacity: 1; text-shadow: none; } }
    @keyframes ta-tick-down { 0% { transform: translateY(-4px); opacity: .55; text-shadow: 0 0 10px rgba(16, 185, 129, .9); } 100% { transform: none; opacity: 1; text-shadow: none; } }
    .ta-tick-up { display: inline-block; animation: ta-tick-up .7s cubic-bezier(.2, .8, .2, 1); }
    .ta-tick-down { display: inline-block; animation: ta-tick-down .7s cubic-bezier(.2, .8, .2, 1); }
    /* AI 分析步驟條：目前步驟的光環脈動 */
    @keyframes ta-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, .55); } 50% { box-shadow: 0 0 0 5px rgba(167, 139, 250, 0); } }
    .ta-pulse { animation: ta-pulse 1.4s ease-in-out infinite; }
    /* 彈窗、導覽框：半透明毛玻璃（底下已有暗色遮罩，文字仍清楚） */
    .fixed .rounded-2xl[class*="bg-slate-900"] {
      background-color: rgba(15, 23, 42, 0.82);
      background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 45%);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 24px 60px -20px rgba(0, 0, 0, 0.75);
    }
    /* 資訊密度：緊湊＝卡片內距與垂直間距縮小（只動 main 內，不影響側欄與彈窗） */
    html[data-density="compact"] main .p-5 { padding: 0.9rem; }
    html[data-density="compact"] main .p-4 { padding: 0.75rem; }
    html[data-density="compact"] main .space-y-5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.85rem; }
    html[data-density="compact"] main .space-y-4 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.7rem; }
    html[data-density="compact"] main .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem; }
    html[data-density="compact"] main .gap-4 { gap: 0.65rem; }
    /* 減少動態效果：作業系統設定，或設定頁選「減少」 */
    @media (prefers-reduced-motion: reduce) {
      html:not([data-motion="reduce"]) .ta-page, html:not([data-motion="reduce"]) .ta-tick-up,
      html:not([data-motion="reduce"]) .ta-tick-down, html:not([data-motion="reduce"]) .ta-pulse { animation: none; }
      html:not([data-motion="reduce"]) button, html:not([data-motion="reduce"]) .rounded-2xl,
      html:not([data-motion="reduce"]) .rounded-xl, html:not([data-motion="reduce"]) .rounded-lg { transition: none !important; }
      html:not([data-motion="reduce"]) button:hover, html:not([data-motion="reduce"]) button:active,
      html:not([data-motion="reduce"]) .cursor-pointer:hover { transform: none !important; }
    }
    html[data-motion="reduce"] .ta-page, html[data-motion="reduce"] .ta-fade-up, html[data-motion="reduce"] .ta-grow-x,
    html[data-motion="reduce"] .ta-tick-up, html[data-motion="reduce"] .ta-tick-down, html[data-motion="reduce"] .ta-pulse { animation: none !important; }
    html[data-motion="reduce"] .ta-tab-ind, html[data-motion="reduce"] button, html[data-motion="reduce"] .rounded-2xl,
    html[data-motion="reduce"] .rounded-xl, html[data-motion="reduce"] .rounded-lg { transition: none !important; }
    html[data-motion="reduce"] button:hover, html[data-motion="reduce"] button:active,
    html[data-motion="reduce"] .cursor-pointer:hover { transform: none !important; }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* ===== 個股工作區配色（與設計稿一致）：深藍黑底、藍紫漸層強調色 ===== */
    :root { --up: #ff4d6d; --down: #22d3a0; --up-bg: color-mix(in srgb, var(--up) 16%, transparent); --down-bg: color-mix(in srgb, var(--down) 16%, transparent); }
    html[data-color="us"] { --up: #22d3a0; --down: #ff4d6d; --up-bg: color-mix(in srgb, var(--up) 16%, transparent); --down-bg: color-mix(in srgb, var(--down) 16%, transparent); }
    body {
      background:
        radial-gradient(900px 500px at 8% -10%, rgba(79, 124, 255, 0.16), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(139, 92, 246, 0.14), transparent 55%),
        #070a13;
      background-attachment: fixed;
    }
    #root aside, #root header.shrink-0 { background-color: rgba(7, 10, 19, 0.72); border-color: rgba(255, 255, 255, 0.08); }
    /* 側欄項目：目前頁面用藍紫漸層底，取代原本的左側細線 */
    .ta-nav { border: 0; background: transparent; }
    .ta-nav-active { background: linear-gradient(135deg, rgba(79, 124, 255, 0.28), rgba(139, 92, 246, 0.2)) !important; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
    button.bg-sky-600, button.bg-blue-600 { background-image: linear-gradient(135deg, #4f7cff, #8b5cf6); box-shadow: 0 6px 20px -8px rgba(79, 124, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18); }

    /* V4 卡片：半透明底、白色細框。刻意不用 backdrop-filter：它會讓卡片內 position: fixed 的東西（K 線放大、提示框）
       改以卡片為定位基準而跑位或被擋住；這裡的背景是平滑漸層，有沒有模糊看不出差別 */
    .ta-card {
      position: relative;
      background-color: rgba(17, 22, 37, 0.76);
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 55%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .ta-card:hover { border-color: rgba(255, 255, 255, 0.16); }

    /* 卡片格線（CardBox）裡再放一張舊式大卡（例如模擬下單面板）時，拿掉內層的框，避免卡片套卡片 */
    .ta-cardbody .rounded-2xl[class*="bg-slate-900"],
    .ta-cardbody .rounded-2xl[class*="bg-slate-900"]:hover,
    .ta-cardbody .ta-card, .ta-cardbody .ta-card:hover { background: none; border: 0; box-shadow: none; padding: 0; }

    /* 卡片裡的長網址、長代號要能換行，不要把卡片撐破 */
    .ta-cardbody { min-width: 0; overflow-wrap: anywhere; }
    /* 頂欄行情狀態的小綠點 */
    @keyframes ta-live { 50% { opacity: .35; } }
    .ta-live-dot { background: var(--down); box-shadow: 0 0 8px var(--down); animation: ta-live 1.8s infinite; }

    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(51, 65, 85, 0.7);
      backdrop-filter: blur(8px);
    }

    .active-tab {
      background: #2a78d6;
      color: #ffffff;
      border-color: #3987e5;
    }

    .module-active {
      background: rgba(37, 99, 235, 0.16);
      border-color: #3b82f6;
      color: #ffffff;
    }
